
name: Sync Upstream

on:
  schedule:
    # 每天 UTC 04:00、10:00、16:00、22:00 执行
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/shizuku30/DFLegacy.git
          git fetch upstream
          git checkout main
          git merge upstream/main
          git push origin main
